; Proyecto PlatformIO de la Práctica 2 (SIS-234).
; Abrir la carpeta raíz del repositorio en VS Code con la extensión PlatformIO IDE.
;
; Cada firmware es un entorno distinto que compila solo su carpeta dentro de esp32/src/:
;   wifi_test -> prueba de comunicación ESP32 -> servidor TCP (video)
; Más adelante se agregan los entornos "sensor" y "actuator".

[platformio]
src_dir = esp32/src
include_dir = esp32/include
default_envs = wifi_test

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:wifi_test]
build_src_filter = +<wifi_test/>
